    <!-- Inner swoosh loop & aerodynamic wake cut through X -->
    <path d="M 810 270 C 890 315 970 395 1010 460 C 970 410 900 345 830 310 C 800 295 805 280 810 270 Z" />
    <path d="M 800 340 C 840 380 885 450 910 500 C 880 460 835 410 790 380 C 780 372 785 355 800 340 Z" />
  </g>
</svg>

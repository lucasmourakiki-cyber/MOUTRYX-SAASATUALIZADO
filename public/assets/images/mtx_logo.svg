<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sharp clean brand color & subtle glow gradient -->
    <linearGradient id="mtxBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4F5" />
      <stop offset="100%" stop-color="#0096DC" />
    </linearGradient>
  </defs>

  <!-- Group for MTX Brand Logo -->
  <g fill="#00A3E0">
    <!-- M -->
    <path d="M 60 520 L 60 210 L 145 210 L 235 385 L 325 210 L 410 210 L 410 520 L 335 520 L 335 305 L 255 460 L 215 460 L 135 305 L 135 520 Z" />

    <!-- T -->
    <path d="M 440 210 L 730 210 L 730 280 L 620 280 L 620 520 L 550 520 L 550 280 L 440 280 Z" />

    <!-- X & Dynamic Trajectory Swoosh -->
    <!-- X Left diagonal bottom segment -->
    <path d="M 740 520 L 840 375 L 895 440 L 835 520 Z" />
    
    <!-- X Right-to-Left diagonal (full back stroke) -->
